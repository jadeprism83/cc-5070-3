<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>高速载具跟随构图镜头 · 演示</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <div id="viewWrap">
      <canvas id="view"></canvas>
      <canvas id="hud"></canvas>
      <div id="hint">W/S 油门·刹车 &nbsp; A/D 转向 &nbsp; R 重置回自由驾驶</div>
    </div>
    <div id="panel">
      <h1>载具镜头 · 跟随构图</h1>

      <section>
        <h2>镜头参数</h2>
        <label>前视距离 <output id="lookVal">12.0</output> m</label>
        <input id="look" type="range" min="4" max="30" step="0.5" value="12">
        <label>死区宽 <output id="dzxVal">0.22</output>（半视场单位）</label>
        <input id="dzx" type="range" min="0.05" max="0.45" step="0.01" value="0.22">
        <label>死区高 <output id="dzyVal">0.16</output>（半视场单位）</label>
        <input id="dzy" type="range" min="0.05" max="0.45" step="0.01" value="0.16">
      </section>

      <section>
        <h2>场景（按钮直接驱动同一套镜头实现）</h2>
        <div id="btns">
          <button data-mode="manual" class="on">自由驾驶</button>
          <button data-mode="accel">加速测试</button>
          <button data-mode="curve">连续弯道</button>
          <button data-mode="sideslip">侧滑测试</button>
        </div>
      </section>

      <section>
        <h2>实时</h2>
        <table id="live">
          <tr><td>模式</td><td id="lvMode">自由驾驶</td><td>车速</td><td id="lvSpeed">0.0 m/s</td></tr>
          <tr><td>构图误差 ex</td><td id="lvEx">–</td><td>构图误差 ey</td><td id="lvEy">–</td></tr>
          <tr><td>构图误差 |e|</td><td id="lvE">–</td><td>死区状态</td><td id="lvDz">–</td></tr>
          <tr><td>偏航角速度</td><td id="lvYawR">–</td><td>俯仰角速度</td><td id="lvPitchR">–</td></tr>
          <tr><td>上方留白</td><td id="lvAhead">–</td><td>侧向留白</td><td id="lvSide">–</td></tr>
        </table>
      </section>

      <section>
        <h2>结果区 · 本次运行汇总</h2>
        <div id="summaryBody">尚未完成测试运行。点击上方场景按钮，指标由真实仿真实时累计。</div>
        <button id="exportBtn">导出轨迹记录 JSON</button>
      </section>

      <section>
        <h2>轨迹记录（俯视：白=载具 青=相机 红=前瞻点）</h2>
        <canvas id="map" width="520" height="360"></canvas>
      </section>
    </div>
  </div>
  <script type="module" src="main.js"></script>
</body>
</html>
